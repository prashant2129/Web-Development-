<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical 03</title>
</head>

<body>

<h1>User Registration Form</h1>

<form>

<label>Name:</label>
<input type="text" name="name" placeholder="Enter Full Name"><br><br>

<label>Email:</label>
<input type="email" name="email" placeholder="xyz@gmail.com"><br><br>

<label>Password:</label>
<input type="password" name="password" placeholder="Enter Password"><br><br>

<label>Confirm Password:</label>
<input type="password" name="confirm_password" placeholder="Confirm Password"><br><br>

<label>Date Of Birth:</label>
<input type="date" name="dob"><br><br>

<label>Time of Birth:</label>
<input type="time" name="time"><br><br>

<label>Age:</label>
<input type="number" name="age" min="18" max="65"><br><br>

<label>Gender:</label>
<input type="radio" name="gender" value="male">Male
<input type="radio" name="gender" value="female">Female
<input type="radio" name="gender" value="other">Other<br><br>

<label>Select Skills:</label>
<input type="checkbox" name="skills" value="front-end">Front-End
<input type="checkbox" name="skills" value="back-end">Back-End
<input type="checkbox" name="skills" value="uiux">UI/UX
<input type="checkbox" name="skills" value="dsa">DSA<br><br>

<label>Upload Resume:</label>
<input type="file"><br><br>

<input type="reset">
<input type="submit" value="Submit">

</form>

</body>
</html>
